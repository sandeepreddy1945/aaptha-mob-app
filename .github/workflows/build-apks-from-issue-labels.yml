name: Build APKs from labeled issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: apk-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-apks:
    if: >-
      contains(github.event.issue.labels.*.name, 'release') &&
      contains(github.event.issue.labels.*.name, 'apk')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Configure the ${secret_name} GitHub Actions secret before building APKs."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.keystore
          test -s android/app/upload-key.keystore
          echo "ANDROID_KEYSTORE_FILE=upload-key.keystore" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Choose the next APK release tag
        id: release_tag
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const highestVersion = tags.reduce((highest, tag) => {
              const match = tag.name.match(/^apk-v(\d+)$/);
              return match ? Math.max(highest, Number(match[1])) : highest;
            }, 0);

            core.setOutput('tag', `apk-v${highestVersion + 1}`);

      - name: Name APK files
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p dist/apks
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-release.apk"

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-debug.apk" \
            "dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-release.apk" \
            --target "$GITHUB_SHA" \
            --title "Android APKs $RELEASE_TAG" \
            --notes "Built from commit $GITHUB_SHA after issue #$ISSUE_NUMBER received both the release and apk labels."

      - name: Remove release keystore from runner
        if: always()
        run: rm -f android/app/upload-key.keystore
