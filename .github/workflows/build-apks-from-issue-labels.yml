name: Build APKs from labeled issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: apk-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-apks:
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.action == 'opened' || github.event.label.name == 'release' || github.event.label.name == 'apk' || github.event.label.name == 'debug') &&
      contains(github.event.issue.labels.*.name, 'release') &&
      contains(github.event.issue.labels.*.name, 'apk')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      release_url: ${{ steps.publish_release.outputs.url }}
      debug_only: ${{ steps.build_mode.outputs.debug_only }}
    env:
      CI: 'true'
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DEBUG_ONLY: ${{ contains(github.event.issue.labels.*.name, 'debug') }}

    steps:
      - name: Comment that APK build started
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          script: |
            const mode = process.env.DEBUG_ONLY === 'true' ? 'debug APK only' : 'debug and release APKs';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Building ${mode} from commit ${context.sha}. I will post the result here.`,
            });
        env:
          DEBUG_ONLY: ${{ contains(github.event.issue.labels.*.name, 'debug') }}

      - name: Determine requested APK variants
        id: build_mode
        run: echo "debug_only=$DEBUG_ONLY" >> "$GITHUB_OUTPUT"

      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore release signing key
        if: env.DEBUG_ONLY != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Configure the ${secret_name} GitHub Actions secret before building APKs."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.keystore
          test -s android/app/upload-key.keystore
          echo "ANDROID_KEYSTORE_FILE=upload-key.keystore" >> "$GITHUB_ENV"

      - name: Build requested APK variants
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          if [[ "$DEBUG_ONLY" == "true" ]]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          fi

      - name: Comment that APK builds completed
        uses: actions/github-script@v7
        env:
          DEBUG_ONLY: ${{ env.DEBUG_ONLY }}
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          script: |
            const artifacts = process.env.DEBUG_ONLY === 'true' ? 'debug APK' : 'debug and signed release APKs';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ The ${artifacts} build completed. Preparing the incremented release tag and GitHub Release.`,
            });

      - name: Choose the next APK release tag
        id: release_tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const highestVersion = tags.reduce((highest, tag) => {
              const match = tag.name.match(/^apk-v(\d+)$/);
              return match ? Math.max(highest, Number(match[1])) : highest;
            }, 0);

            core.setOutput('tag', `apk-v${highestVersion + 1}`);

      - name: Name selected APK files
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p dist/apks
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-debug.apk"
          if [[ "$DEBUG_ONLY" != "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-release.apk"
          fi

      - name: Publish APKs to GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          DEBUG_ONLY: ${{ env.DEBUG_ONLY }}
        run: |
          ASSETS=("dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-debug.apk")
          if [[ "$DEBUG_ONLY" != "true" ]]; then
            ASSETS+=("dist/apks/${REPOSITORY_NAME}-${RELEASE_TAG}-release.apk")
            NOTES="Built debug and release APKs from $GITHUB_SHA for issue #$ISSUE_NUMBER."
          else
            NOTES="Built the debug APK from $GITHUB_SHA for issue #$ISSUE_NUMBER (debug label selected)."
          fi

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Android APKs $RELEASE_TAG" \
            --notes "$NOTES"
          echo "url=$(gh release view "$RELEASE_TAG" --json url --jq '.url')" >> "$GITHUB_OUTPUT"

      - name: Remove release keystore from runner
        if: always()
        run: rm -f android/app/upload-key.keystore

  report-issue:
    if: >-
      always() &&
      github.event.issue.state == 'open' &&
      (github.event.action == 'opened' || github.event.label.name == 'release' || github.event.label.name == 'apk' || github.event.label.name == 'debug') &&
      contains(github.event.issue.labels.*.name, 'release') &&
      contains(github.event.issue.labels.*.name, 'apk')
    needs: build-apks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Comment on release outcome and close on success
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build-apks.result }}
          RELEASE_TAG: ${{ needs.build-apks.outputs.release_tag }}
          RELEASE_URL: ${{ needs.build-apks.outputs.release_url }}
          DEBUG_ONLY: ${{ needs.build-apks.outputs.debug_only }}
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          script: |
            const issueNumber = context.issue.number;
            const buildResult = process.env.BUILD_RESULT;

            if (buildResult === 'success') {
              const artifacts = process.env.DEBUG_ONLY === 'true'
                ? 'The debug APK is attached (the debug label was present).'
                : 'Both debug and release APKs are attached.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `✅ APK release completed successfully. Tag: [${process.env.RELEASE_TAG}](${process.env.RELEASE_URL}). ${artifacts} Closing this issue.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed',
              });
              return;
            }

            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const failedSteps = data.jobs.flatMap((job) =>
              (job.steps ?? [])
                .filter((step) => step.conclusion === 'failure')
                .map((step) => `${job.name}: ${step.name}`)
            );
            const failureDetail = failedSteps.length
              ? `Failing step(s): ${failedSteps.join('; ')}.`
              : `Workflow result: ${buildResult || 'unknown'}.`;
            const releasePermissionFailure = failedSteps.some((step) =>
              /Choose the next APK release tag|Publish APKs to GitHub Release/.test(step)
            );
            const permissionHint = releasePermissionFailure
              ? ' If this was HTTP 403, enable read/write workflow permissions or configure GH_RELEASE_TOKEN with Contents read/write, Issues read/write, and Actions read.'
              : '';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ APK release did not complete. ${failureDetail}${permissionHint} [Open workflow logs for the error details](${runUrl}). This issue remains open; fix the problem and reapply the release/apk labels or rerun the workflow.`,
            });
